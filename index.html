<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#F6F7FB">
<title>Каталог сервисов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

   m[i].l=1*new Date();

   k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)})
   (window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");

   var YOUR_METRIKA_ID = 111755720;

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:var(--tg-theme-bg-color,#F6F7FB);
  --surface:var(--tg-theme-secondary-bg-color,#FFFFFF);
  --text:var(--tg-theme-text-color,#1B1E2B);
  --hint:var(--tg-theme-hint-color,#6B7280);
  --border:#E4E7F0;
  --accent:var(--tg-theme-button-color,#5B5BD6);
  --accent-text:var(--tg-theme-button-text-color,#FFFFFF);
  --accent-soft:#EEF0FD;
  --danger:#DC2626;
  --danger-soft:#FDEEEE;
  --success:#16A34A;
  --shadow:0 1px 2px rgba(27,30,43,.04), 0 8px 24px -12px rgba(27,30,43,.12);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
  margin:0;
  padding:28px 16px 40px;
  background:var(--bg);
  color:var(--text);
  font-family:'Manrope',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}

.container{width:100%;max-width:520px;margin:auto}

/* ---------- Header / signature portal glow ---------- */
.header{position:relative;text-align:center;margin-bottom:26px;padding-top:6px}
.portal-glow{
  position:absolute;
  top:-58px;left:50%;
  transform:translateX(-50%);
  width:230px;height:230px;
  border-radius:50%;
  background:radial-gradient(circle at 50% 40%, rgba(91,91,214,.16), rgba(91,91,214,.05) 55%, rgba(91,91,214,0) 72%);
  pointer-events:none;
  z-index:0;
}
.portal-ring{
  position:absolute;
  top:-18px;left:50%;
  transform:translateX(-50%);
  width:104px;height:104px;
  border-radius:50%;
  border:1.5px solid rgba(91,91,214,.35);
  z-index:0;
}
.portal-ring::after{
  content:"";
  position:absolute;inset:14px;
  border-radius:50%;
  border:1.5px solid rgba(91,91,214,.22);
}
.title{
  position:relative;z-index:1;
  margin:0;
  font-family:'Unbounded',sans-serif;
  font-size:23px;
  font-weight:800;
  letter-spacing:-.01em;
}
.subtitle{position:relative;z-index:1;margin:6px 0 0;color:var(--hint);font-size:13px;font-weight:600}

/* ---------- Cards ---------- */
#cards{display:flex;flex-direction:column;gap:10px}

.card{
  display:flex;align-items:center;gap:14px;
  padding:14px;
  border:1px solid var(--border);
  border-radius:20px;
  background:var(--surface);
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:transform .12s ease, box-shadow .12s ease;
}
.card:active{transform:scale(.985);box-shadow:0 1px 2px rgba(27,30,43,.06)}

.card img{
  width:50px;height:50px;
  border-radius:14px;
  object-fit:cover;flex:none;
  background:var(--accent-soft);
}

.info{min-width:0;flex:1}
.card-title{display:block;font-size:15.5px;font-weight:800;color:var(--text)}
.card-desc{
  display:block;margin-top:2px;color:var(--hint);font-size:12.5px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

.status{text-align:center;padding:26px 12px;color:var(--hint);font-size:13px;font-weight:600}

/* ---------- Share ---------- */
.share{
  margin-top:14px;justify-content:center;
  background:transparent;
  border:1.5px dashed var(--border);
  box-shadow:none;
}
.share .card-title{color:var(--accent)}
.share .card-desc{color:var(--hint)}

/* ---------- Admin toggle ---------- */
.admin-toggle{
  margin-top:18px;width:100%;padding:13px;
  border:1px solid var(--border);
  border-radius:16px;
  background:var(--surface);
  color:var(--text);
  font-family:'Manrope',sans-serif;
  font-size:14px;font-weight:800;
  cursor:pointer;
  box-shadow:var(--shadow);
}
.admin-toggle:active{transform:scale(.985)}

/* ---------- Admin panel ---------- */
#adminPanel{display:none;margin-top:20px;padding-top:20px;border-top:1px solid var(--border)}
#adminPanel.open{display:block}

.admin-title{font-family:'Unbounded',sans-serif;font-size:14px;font-weight:600;margin:0 0 12px;letter-spacing:-.01em}

.admin-list{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.admin-item{
  display:flex;align-items:center;gap:10px;padding:10px;
  border:1px solid var(--border);border-radius:16px;
  background:var(--surface);
}
.admin-item img{width:36px;height:36px;border-radius:10px;object-fit:cover;flex:none;background:var(--accent-soft)}
.admin-item .info{font-size:12px}
.admin-item .card-title{font-size:13px}
.admin-item .card-desc{font-size:11px}

.admin-actions{display:flex;gap:6px;flex:none}
.icon-btn{border:none;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:800;cursor:pointer}
.icon-btn.edit{background:var(--accent-soft);color:var(--accent)}
.icon-btn.del{background:var(--danger-soft);color:var(--danger)}

/* ---------- Form ---------- */
.form{display:flex;flex-direction:column;gap:10px}
.form label{font-size:12px;color:var(--hint);font-weight:700}
.form input{
  width:100%;padding:12px 13px;
  border-radius:14px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  font-family:'Manrope',sans-serif;
  font-size:14px;font-weight:600;
  outline:none;
  transition:border-color .12s ease;
}
.form input::placeholder{color:var(--hint);font-weight:500}
.form input:focus{border-color:var(--accent)}

.form-row{display:flex;gap:8px}
.form-row .field{flex:1;min-width:0}

.btn-row{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;padding:13px;border:none;border-radius:14px;font-family:'Manrope',sans-serif;font-size:14px;font-weight:800;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-text)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}

.form-msg{font-size:12px;font-weight:700;min-height:16px;color:var(--hint)}
.form-msg.error{color:var(--danger)}
.form-msg.ok{color:var(--success)}
</style>
</head>
<body>
<main class="container">
<header class="header">
  <div class="portal-glow" aria-hidden="true"></div>
  <div class="portal-ring" aria-hidden="true"></div>
  <h1 class="title">Добро пожаловать!</h1>
  <p class="subtitle">Выберите раздел для продолжения</p>
</header>

<section id="cards" aria-live="polite"><div class="status">Загрузка...</div></section>

<div class="card share" id="shareButton"><div class="info"><span class="card-title">🔗 Поделиться</span><span class="card-desc">Отправить ссылку друзьям</span></div></div>

<button type="button" class="admin-toggle" id="adminToggle" style="display:none">🛠 Админ-панель</button>

<section id="adminPanel" aria-live="polite">
  <h2 class="admin-title">Управление карточками</h2>
  <div class="admin-list" id="adminList"></div>

  <h2 class="admin-title" id="formTitle">Добавить карточку</h2>
  <form class="form" id="cardForm" autocomplete="off">
    <div class="field">
      <label for="f_key">Ключ (card_key, латиница/цифры/-/_)</label>
      <input id="f_key" name="card_key" maxlength="30" pattern="[a-zA-Z0-9_-]+" required>
    </div>
    <div class="field">
      <label for="f_title">Название</label>
      <input id="f_title" name="title" maxlength="50" required>
    </div>
    <div class="field">
      <label for="f_desc">Описание</label>
      <input id="f_desc" name="description" maxlength="150" required>
    </div>
    <div class="form-row">
      <div class="field">
        <label for="f_url">Партнёрская ссылка (https://...)</label>
        <input id="f_url" name="url" type="url" required>
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label for="f_img">Ссылка на картинку (https://...)</label>
        <input id="f_img" name="image_url" type="url" required>
      </div>
    </div>
    <div class="form-msg" id="formMsg"></div>
    <div class="btn-row">
      <button type="submit" class="btn primary" id="submitBtn">Сохранить</button>
      <button type="button" class="btn ghost" id="cancelEditBtn" style="display:none">Отмена</button>
    </div>
  </form>
</section>

</main>
<script>
"use strict";
const tg = window.Telegram?.WebApp;
const cardsElement = document.getElementById("cards");
const adminToggle = document.getElementById("adminToggle");
const adminPanel = document.getElementById("adminPanel");
const adminList = document.getElementById("adminList");
const cardForm = document.getElementById("cardForm");
const formMsg = document.getElementById("formMsg");
const formTitle = document.getElementById("formTitle");
const submitBtn = document.getElementById("submitBtn");
const cancelEditBtn = document.getElementById("cancelEditBtn");
const keyInput = document.getElementById("f_key");

let isAdmin = false;
let editingKey = null;

if (tg) { tg.ready(); tg.expand(); }

const tgUser = tg?.initDataUnsafe?.user || null;
if (typeof ym === "function" && tgUser?.id) {
  ym(YOUR_METRIKA_ID, "userParams", {
    UserID: tgUser.id,
    telegram_username: tgUser.username || "",
  });
}

function track(goal, params) {
  try {
    if (typeof ym === "function") ym(YOUR_METRIKA_ID, "reachGoal", goal, params || {});
  } catch (e) {
    console.error("Metrika error", e);
  }
}

function initData() {
  return tg?.initData || "";
}

function openTelegramUrl(url) {
  if (typeof url !== "string" || !/^https?:\/\//i.test(url)) return;
  try {
    if (tg) tg.openTelegramLink(url);
    else window.open(url, "_blank", "noopener,noreferrer");
  } catch (e) {
    console.error(e);
    tg?.showAlert?.("Не удалось открыть ссылку.");
  }
}

async function api(path, options = {}) {
  const headers = new Headers(options.headers || {});
  headers.set("X-Telegram-Init-Data", initData());
  if (options.body) headers.set("Content-Type", "application/json");
  const response = await fetch(path, { ...options, headers, credentials: "same-origin", cache: "no-store" });
  let data = null;
  try { data = await response.json(); } catch {}
  if (!response.ok) throw new Error(data?.detail || "Ошибка сервера.");
  return data;
}

function renderCards(cards) {
  cardsElement.replaceChildren();
  if (!Array.isArray(cards) || !cards.length) {
    cardsElement.innerHTML = '<div class="status">Пока нет доступных разделов.</div>';
    return;
  }
  for (const card of cards) {
    const article = document.createElement("article");
    article.className = "card";
    const image = document.createElement("img");
    image.src = String(card.image_url || "");
    image.alt = "";
    image.loading = "lazy";
    image.referrerPolicy = "no-referrer";
    image.onerror = () => { image.src = "https://via.placeholder.com/96"; };
    const info = document.createElement("div");
    info.className = "info";
    const title = document.createElement("span");
    title.className = "card-title";
    title.textContent = String(card.title || "");
    const desc = document.createElement("span");
    desc.className = "card-desc";
    desc.textContent = String(card.description || "");
    info.append(title, desc);
    article.append(image, info);
    article.addEventListener("click", () => {
      track("card_open", { card_key: card.card_key, title: card.title });
      openTelegramUrl(card.url);
    });
    cardsElement.append(article);
  }
}

function renderAdminList(cards) {
  adminList.replaceChildren();
  if (!Array.isArray(cards) || !cards.length) {
    adminList.innerHTML = '<div class="status">Карточек пока нет.</div>';
    return;
  }
  for (const card of cards) {
    const row = document.createElement("div");
    row.className = "admin-item";
    const image = document.createElement("img");
    image.src = String(card.image_url || "");
    image.onerror = () => { image.src = "https://via.placeholder.com/64"; };
    const info = document.createElement("div");
    info.className = "info";
    info.style.flex = "1";
    info.style.minWidth = "0";
    const title = document.createElement("span");
    title.className = "card-title";
    title.textContent = String(card.title || "");
    const desc = document.createElement("span");
    desc.className = "card-desc";
    desc.textContent = card.card_key;
    info.append(title, desc);
    const actions = document.createElement("div");
    actions.className = "admin-actions";
    const editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.className = "icon-btn edit";
    editBtn.textContent = "✏️";
    editBtn.addEventListener("click", () => startEdit(card));
    const delBtn = document.createElement("button");
    delBtn.type = "button";
    delBtn.className = "icon-btn del";
    delBtn.textContent = "🗑";
    delBtn.addEventListener("click", () => deleteCard(card.card_key));
    actions.append(editBtn, delBtn);
    row.append(image, info, actions);
    adminList.append(row);
  }
}

function setFormMsg(text, type) {
  formMsg.textContent = text || "";
  formMsg.className = "form-msg" + (type ? " " + type : "");
}

function startEdit(card) {
  editingKey = card.card_key;
  keyInput.value = card.card_key;
  keyInput.disabled = true;
  document.getElementById("f_title").value = card.title || "";
  document.getElementById("f_desc").value = card.description || "";
  document.getElementById("f_url").value = card.url || "";
  document.getElementById("f_img").value = card.image_url || "";
  formTitle.textContent = "Редактировать карточку";
  submitBtn.textContent = "Обновить";
  cancelEditBtn.style.display = "block";
  setFormMsg("", "");
  cardForm.scrollIntoView({ behavior: "smooth", block: "start" });
}

function resetForm() {
  editingKey = null;
  cardForm.reset();
  keyInput.disabled = false;
  formTitle.textContent = "Добавить карточку";
  submitBtn.textContent = "Сохранить";
  cancelEditBtn.style.display = "none";
  setFormMsg("", "");
}

cancelEditBtn.addEventListener("click", resetForm);

async function deleteCard(cardKey) {
  const confirmed = tg?.showConfirm
    ? await new Promise((resolve) => tg.showConfirm("Удалить карточку?", resolve))
    : window.confirm("Удалить карточку?");
  if (!confirmed) return;
  try {
    await api(`/api/admin/delete-card/${encodeURIComponent(cardKey)}`, { method: "DELETE" });
    track("admin_delete_card", { card_key: cardKey });
    if (editingKey === cardKey) resetForm();
    await loadAll();
  } catch (e) {
    tg?.showAlert?.(e.message || "Не удалось удалить карточку.");
  }
}

cardForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  const payload = {
    card_key: keyInput.value.trim(),
    title: document.getElementById("f_title").value.trim(),
    description: document.getElementById("f_desc").value.trim(),
    url: document.getElementById("f_url").value.trim(),
    image_url: document.getElementById("f_img").value.trim(),
  };
  submitBtn.disabled = true;
  setFormMsg("Сохранение...", "");
  try {
    const path = editingKey ? "/api/admin/update-card" : "/api/admin/create-card";
    await api(path, { method: "POST", body: JSON.stringify(payload) });
    track(editingKey ? "admin_update_card" : "admin_create_card", { card_key: payload.card_key });
    setFormMsg("Готово!", "ok");
    resetForm();
    await loadAll();
  } catch (e) {
    setFormMsg(e.message || "Ошибка сохранения.", "error");
  } finally {
    submitBtn.disabled = false;
  }
});

adminToggle.addEventListener("click", () => {
  const open = adminPanel.classList.toggle("open");
  adminToggle.textContent = open ? "🛠 Скрыть админ-панель" : "🛠 Админ-панель";
  if (open) {
    track("admin_panel_open");
    loadAdminList();
  }
});

async function loadAdminList() {
  try {
    renderAdminList(await api("/api/get-cards"));
  } catch (e) {
    adminList.innerHTML = '<div class="status">Не удалось загрузить список.</div>';
  }
}

async function loadCards() {
  try {
    renderCards(await api("/api/get-cards"));
  } catch (e) {
    console.error(e);
    cardsElement.innerHTML = '<div class="status">Не удалось загрузить данные. Попробуйте позже.</div>';
  }
}

async function checkAdmin() {
  try {
    const me = await api("/api/me");
    isAdmin = Boolean(me?.is_admin);
    adminToggle.style.display = isAdmin ? "block" : "none";
  } catch (e) {
    isAdmin = false;
  }
}

async function loadAll() {
  await Promise.all([loadCards(), isAdmin && adminPanel.classList.contains("open") ? loadAdminList() : Promise.resolve()]);
}

document.getElementById("shareButton").addEventListener("click", () => {
  track("share_click");
  const url = "https://t.me/share/url?url=" + encodeURIComponent("https://t.me/Chelsgameappbot") + "&text=" + encodeURIComponent("Присоединяйся!");
  openTelegramUrl(url);
});

(async function init() {
  await checkAdmin();
  await loadCards();
})();
</script>
</body>
</html>
